name: Publish Ores & Tiers to CurseForge

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25' # Required baseline for Minecraft 26.3
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Mod Jar
        run: ./gradlew build

      - name: Upload to CurseForge
        uses: Kir-Antipov/mc-publish@v3
        with:
          # Configuration for ZiNG's Ores & Tiers
          curseforge-id: 1445925 
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          
          # Target Game Settings for Wilderness Bound 26.3
          game-versions: |
            26.3
          loaders: |
            neoforge
            
          # Binary Paths
          files: |
            build/libs/*-all.jar
          version-type: release
